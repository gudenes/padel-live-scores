<svg xmlns="http://www.w3.org/2000/svg" width="320" height="50" viewBox="0 0 320 50">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1b3a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="320" height="50" fill="url(#bg)"/>
  <!-- logo chip -->
  <rect x="10" y="11" width="28" height="28" rx="6" fill="#3b82f6"/>
  <text x="24" y="30" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">APG</text>
  <!-- brand + headline -->
  <text x="48" y="23" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#f8fafc">AceProGrip</text>
  <text x="48" y="38" font-family="Arial, sans-serif" font-size="10" fill="#aebfd8">Grip like the pros</text>
  <!-- CTA pill -->
  <rect x="232" y="13" width="78" height="24" rx="12" fill="#3b82f6"/>
  <text x="271" y="29" font-family="Arial, sans-serif" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">Shop grips</text>
</svg>
