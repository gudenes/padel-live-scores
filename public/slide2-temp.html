<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Inter', sans-serif; background: #0A0A0A; padding: 80px 60px; position: relative; }
  body::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 30%, rgba(126,211,33,0.08) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(255,70,85,0.1) 0%, transparent 40%); }
  .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }
  .header { margin-bottom: 60px; }
  .eyebrow { font-size: 20px; font-weight: 800; color: #F5A623; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
  .title { font-size: 96px; font-weight: 900; color: #fff; line-height: 0.95; letter-spacing: -3px; text-transform: uppercase; }
  .title .accent { color: #7ED321; }
  .round { background: rgba(255,255,255,0.06); padding: 40px 48px; clip-path: polygon(0% 1%, 99.5% 0%, 100% 99%, 0.5% 100%); margin-bottom: 28px; }
  .round.upset { background: linear-gradient(135deg, rgba(255,70,85,0.12), rgba(255,70,85,0.04)); border-left: 6px solid #FF4655; clip-path: none; border-radius: 6px; }
  .round-label { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 16px; clip-path: polygon(3% 5%, 97% 0%, 100% 95%, 0% 100%); font-size: 18px; font-weight: 800; color: rgba(255,255,255,0.8); letter-spacing: 2px; margin-bottom: 20px; }
  .round.upset .round-label { background: rgba(255,70,85,0.3); color: #fff; }
  .matchup { font-size: 38px; font-weight: 800; color: #fff; line-height: 1.3; margin-bottom: 12px; }
  .matchup .opp { color: rgba(255,255,255,0.7); font-weight: 700; }
  .score { font-size: 56px; font-weight: 900; color: #7ED321; font-family: 'Inter', monospace; letter-spacing: 4px; }
  .round.upset .score { color: #FF4655; }
  .bagel { display: inline-block; background: #FF4655; color: #fff; padding: 8px 20px; font-size: 28px; font-weight: 900; margin-left: 16px; clip-path: polygon(3% 5%, 97% 0%, 100% 95%, 0% 100%); transform: rotate(-2deg); }
  .footer { margin-top: auto; padding-top: 40px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
  .pair-tag { font-size: 22px; font-weight: 800; color: rgba(255,255,255,0.7); letter-spacing: 1px; }
  .pair-tag .bold { color: #7ED321; }
  .logo-wrap { height: 56px; display: flex; align-items: center; }
  .logo-wrap img { height: 100%; object-fit: contain; }
</style></head><body>
  <div class="content">
    <div class="header">
      <div class="eyebrow">THE ROAD TO QF</div>
      <div class="title">FROM<br/><span class="accent">QUALIFYING</span><br/>TO THE TOP</div>
    </div>
    <div class="round">
      <div class="round-label">R32</div>
      <div class="matchup">Hernández / Jensen <span class="opp">vs Cepero / García (#37)</span></div>
      <div class="score">7-6 · 6-0</div>
    </div>
    <div class="round upset">
      <div class="round-label">⚡ R16 · UPSET</div>
      <div class="matchup">Hernández / Jensen <span class="opp">vs LEBRÓN / Augsburger (#5)</span></div>
      <div class="score">7-6 · 3-6 · 6-0 <span class="bagel">BAGEL!</span></div>
    </div>
    <div class="footer">
      <div class="pair-tag">HERNÁNDEZ 🇪🇸 <span class="bold">+</span> JENSEN 🇮🇹</div>
      <div class="logo-wrap"><img src="/logo-temp.png" alt="PadelNachos"/></div>
    </div>
  </div>
</body></html>
