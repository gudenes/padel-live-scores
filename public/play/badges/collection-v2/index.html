<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Padel Nachos · Badge collection</title><style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee7d2;font:16px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #454137;padding-bottom:24px}small{color:#ff9a45;font-weight:800;letter-spacing:2px}h1{font-size:clamp(24px,5vw,36px);margin:8px 0}p{color:#b9b7a9;max-width:620px;line-height:1.5}select{padding:12px;background:#282820;color:#eee7d2;border:1px solid #68604c;font:inherit}select:focus-visible{outline:2px solid #ff8a3d;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px;padding:24px 0}article{text-align:center;min-width:0}img{width:100%;height:220px;object-fit:contain;mix-blend-mode:lighten}h2{font-size:19px;margin:12px 0}.tag{font-size:11px;color:#c4b697}footer{font-size:13px;color:#b9b7a9;border-top:1px solid #454137;padding-top:18px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:160px}h2{font-size:16px}header{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:no-preference){img{transition:transform .18s}article:hover img{transform:translateY(-4px)}}
</style><main><header><div><small>PADEL NACHOS</small><h1 id="title">Your badge collection</h1><p id="intro"></p></div><label>Language / Idioma<br><select id="language"><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="fr">Français</option><option value="it">Italiano</option></select></label></header><section class="grid" id="grid" aria-label="Badge artwork"></section><footer id="foot"></footer></main><script>
const data={"ids": ["first-pick", "king-of-predict", "on-fire", "tournament-brain", "scout", "match-tracker", "match-critic", "founding-member", "ambassador"], "names": {"en": ["First Pick", "King of Predict", "On Fire", "Tournament Brain", "Scout", "Match Tracker", "Match Critic", "Founding Member", "Ambassador"], "es": ["Primer pronóstico", "Rey del pronóstico", "En racha", "Mente de torneo", "Ojeador", "Cazapartidos", "Crítico de partidos", "Miembro fundador", "Embajador"], "pt": ["Primeiro palpite", "Rei dos palpites", "Em alta", "Mente de torneio", "Olheiro", "Caçador de partidas", "Crítico de partidas", "Membro fundador", "Embaixador"], "fr": ["Premier pronostic", "Roi des pronostics", "En pleine forme", "Stratège du tournoi", "Dénicheur de talents", "Suivi des matchs", "Critique de matchs", "Membre fondateur", "Ambassadeur"], "it": ["Primo pronostico", "Re dei pronostici", "Inarrestabile", "Mente del torneo", "Talent scout", "Cacciatore di partite", "Critico di partite", "Membro fondatore", "Ambasciatore"]}};
const copy={en:['Your badge collection','Predictions, padel passion and community — one collectible family.','Artwork preview · These are proposed translations. Award rules and existing achievements are unchanged.'],es:['Tu colección de insignias','Pronósticos, pasión por el pádel y comunidad: una misma colección.','Vista previa · Traducciones propuestas. Las reglas y los logros actuales no han cambiado.'],pt:['Sua coleção de conquistas','Palpites, paixão pelo padel e comunidade: uma só coleção.','Prévia · Traduções propostas. As regras e conquistas atuais não mudaram.'],fr:['Votre collection de badges','Pronostics, passion du padel et communauté : une même collection.','Aperçu · Traductions proposées. Les règles et les succès actuels restent inchangés.'],it:['La tua collezione di badge','Pronostici, passione per il padel e community: un’unica collezione.','Anteprima · Traduzioni proposte. Le regole e i traguardi attuali non cambiano.']};
function render(){const lang=document.querySelector('#language').value;document.documentElement.lang=lang;['title','intro','foot'].forEach((id,i)=>document.getElementById(id).textContent=copy[lang][i]);const grid=document.getElementById('grid');grid.replaceChildren();data.ids.forEach((id,i)=>{const card=document.createElement('article');const img=document.createElement('img');img.src=id+'.png';img.alt='';const heading=document.createElement('h2');heading.textContent=data.names[lang][i];card.append(img,heading);grid.append(card)})}document.querySelector('#language').addEventListener('change',render);render();
</script></html>
